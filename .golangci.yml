version: "2"
linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck # includes gosimple and stylecheck
    - unused
    - ineffassign
    - misspell
    - revive
    - gosec
    - gocritic
  exclusions:
    # same as the defaults of golangci-lint v1
    presets:
      - comments
      - std-error-handling
    paths:
      - mock_limiter
      - mock_ddb_client_test.go
    rules:
      - path: _test\.go
        linters:
          - revive
        text: unused-parameter
